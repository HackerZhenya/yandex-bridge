# Optional. Copy to data/config.yaml only if you need to change something.
#
# With no file at all the bridge exports every supported device it finds in the
# Yandex account, which is the intended way to run it. This file exists to hide,
# rename or re-shape individual devices.
#
# Secrets are NOT read from here — they come from the environment:
#   YANDEX_CLIENT_ID, YANDEX_CLIENT_SECRET, HOMEKIT_PIN

# How often the whole smart home is polled. The Yandex user API has no push
# mechanism, so this is the ceiling on how fast a change made in the Yandex app
# shows up in HomeKit. Changes made *from* HomeKit are confirmed much faster.
poll_interval: 15s

# After a write, the affected device is re-read every confirm_interval for
# confirm_window, because Yandex reaches devices through the vendor's cloud and
# the new state is not visible immediately.
confirm_window: 5s
confirm_interval: 1s

# How many consecutive successful polls must agree that the device list changed
# before the HomeKit bridge is rebuilt. Raising it makes the bridge more
# stubborn about partial API responses; lowering it makes new devices appear
# sooner. Do not set this to 1 unless you enjoy surprises.
topology_confirmations: 3

# How many consecutive failed polls mark accessories "Not Responding" and trip
# the Bridge Health sensor.
unhealthy_after: 4

log_level: info
health_addr: ":8080"

homekit:
  name: "Yandex Bridge"
  port: 51826
  # Announce only where HomeKit controllers actually are. Leaving this empty
  # advertises on every interface, including docker0.
  interfaces:
    - eth0

# Per-device overrides, keyed by the Yandex device id. The id is in the logs at
# debug level, and in the /healthz output is the device count only — the easiest
# way to find one is `LOG_LEVEL=debug` on the first run.
devices:
  # A dumb fan plugged into a smart socket: present it to HomeKit as a fan
  # rather than an outlet, so Siri and the Home app treat it as one.
  "socket-id-goes-here":
    type: fan                     # lightbulb | outlet | switch | fan
    name: "Вентилятор в спальне"

  # A lamp that supports both colour and white temperature. HomeKit gets
  # confused when a light exposes both, so the bridge picks one: colour by
  # default. Override if you only ever use this lamp for warm white.
  "lamp-id-goes-here":
    color_mode: temperature       # hsv | temperature

  # Something you do not want in HomeKit at all.
  "noisy-device-id":
    exclude: true
